# All tunable settings live here. DVC watches individual keys (e.g. slow_model.n_iter),
# so changing one value only reruns the stages that use it.
seed: 42

data:
  pm25_threshold: 75      # "polluted" means PM2.5 >= this many ug/m3
  horizon_hours: 24       # we predict this many hours ahead
  max_ffill_hours: 3      # fill missing sensor readings only if the gap is this short

features:
  windows_hours: [6, 24]  # [short, long] rolling windows

feast:
  ttl_days: 3650          # long on purpose: the data is old (2013-2017)

split:
  cutoff_date: "2016-03-01"   # test set = everything from this date on (the last year)

fast_model:
  c_grid: [0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1, 3, 10, 30]   # more values = longer run (aim: about 1 minute)
  cv_folds: 5
  class_weight: null

slow_model:
  n_iter: 2               # SMOKE-TEST value (fast). Raise it in Step 5 to reach 5-10 minutes.
  cv_folds: 3
  max_estimators: 400

evaluate:
  threshold: 0.5
